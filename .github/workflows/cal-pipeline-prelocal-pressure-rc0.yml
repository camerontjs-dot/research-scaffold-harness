name: CAL Pipeline pre-local pressure RC0

on:
  pull_request:
    paths:
      - ".github/workflows/cal-pipeline-prelocal-pressure-rc0.yml"
      - "experiments/cal_pipeline_prelocal_rc0/**"

permissions:
  contents: read

jobs:
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pressure harness exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout exact ClaimGate candidate
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/proposition-authoring
          ref: b3278e960707720f5add10935027a7187725d446
          path: deps/claimgate

      - name: Checkout exact Evidence Bundler candidate
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: deps/eb

      - name: Checkout exact current CAL integration candidate
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: d03d0e960ad82d889e6763fd4fb53cd24babd187
          path: deps/cal

      - name: Checkout exact Contract C2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: deps/apparatus-c2

      - name: Checkout released Contract C1 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          path: deps/apparatus-c1

      - name: Checkout released Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: deps/apparatus-d

      - name: Checkout Contract E research authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: a678c73a661853a3a704666fc6bbf29fa378948f
          path: deps/apparatus-e

      - name: Checkout exact Decision C2 integration candidate
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: b1bcc33e2b5ef0707b8cbf7dd8e821b2d34d1b55
          path: deps/decision

      - name: Install bounded pressure environments
        run: |
          set -euo pipefail
          python -m venv .venv-cg
          .venv-cg/bin/python -m pip install --upgrade pip
          .venv-cg/bin/python -m pip install -e 'deps/claimgate[dev]'
          (cd deps/claimgate && ../../.venv-cg/bin/python scripts/fetch_frozen_predecessors.py)

          python -m venv .venv-eb
          .venv-eb/bin/python -m pip install --upgrade pip
          .venv-eb/bin/python -m pip install \
            'click>=8.1,<9' \
            'pdfminer.six>=20231228,<20270000' \
            'pydantic>=2.6,<3' \
            'pypdf>=4,<7' \
            'PyYAML>=6,<7' \
            'rank-bm25>=0.2.2,<0.3' \
            'pytest>=8,<10'
          .venv-eb/bin/python -m pip install -e deps/eb --no-deps

          python -m venv .venv-cal
          .venv-cal/bin/python -m pip install --upgrade pip
          .venv-cal/bin/python -m pip install -e 'deps/cal[dev]'
          .venv-cal/bin/python -m pip install rfc8785

      - name: ClaimGate maintained pressure suite
        id: claimgate_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/claimgate
          ../../.venv-cg/bin/python -m pytest -q
          ../../.venv-cg/bin/ruff check .

      - name: Evidence Bundler exact integration-boundary suite
        id: eb_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-eb/bin/python -m pytest -q deps/eb/tests/test_v1_contract_b_projection.py

      - name: Current CAL focused integration and semantic pressure suite
        id: cal_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/cal
          ../../.venv-cal/bin/python -m pytest -q \
            tests/production/test_convergence_semantics.py \
            tests/production/test_contract_b_integration_candidate.py \
            tests/production/test_contract_b_run_surface.py \
            tests/production/test_rc1_semantic_behavior.py \
            tests/production/test_production_cli.py \
            tests/production/test_semantic_blob_identity.py \
            tests/production/test_rc1_authority_integrity.py \
            tests/production/test_target_identity_binding.py

      - name: Contract C2 validator pressure suite
        id: c2_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/apparatus-c2
          ../../.venv-cal/bin/python -m pytest -q tests/test_contract_c_v2.py

      - name: Decision C2 ingress hostile-control suite
        id: decision_suite
        continue-on-error: true
        env:
          APPARATUS_CONTRACT_C2_DIR: ${{ github.workspace }}/deps/apparatus-c2
          APPARATUS_CONTRACT_C_DIR: ${{ github.workspace }}/deps/apparatus-c1
          APPARATUS_CONTRACT_D_DIR: ${{ github.workspace }}/deps/apparatus-d
          DECISION_C2_OUTPUT_DIR: ${{ github.workspace }}/build/decision-c2-suite
          PYTHON: ${{ github.workspace }}/.venv-cal/bin/python
        run: |
          set -euo pipefail
          cd deps/decision
          node tests/contractC2Ingress.integration.mjs

      - name: Contract E RC3 successor 65-control suite
        id: contract_e_suite
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/apparatus-e/docs/research/contract-e/v1-rc3-target-reference-cardinality-successor-20260903/candidate
          ${{ github.workspace }}/.venv-cal/bin/python test_successor.py

      - name: Execute exact cross-repository canary and seam attacks
        id: cross_chain
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-cal/bin/python experiments/cal_pipeline_prelocal_rc0/run_pressure.py --root "$GITHUB_WORKSPACE"

      - name: Record component-suite outcomes
        if: always()
        env:
          CLAIMGATE_SUITE: ${{ steps.claimgate_suite.outcome }}
          EB_SUITE: ${{ steps.eb_suite.outcome }}
          CAL_SUITE: ${{ steps.cal_suite.outcome }}
          C2_SUITE: ${{ steps.c2_suite.outcome }}
          DECISION_SUITE: ${{ steps.decision_suite.outcome }}
          CONTRACT_E_SUITE: ${{ steps.contract_e_suite.outcome }}
          CROSS_CHAIN: ${{ steps.cross_chain.outcome }}
        run: |
          mkdir -p build/cal_pipeline_prelocal_rc0
          .venv-cal/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          value = {
              "claim_gate": os.environ["CLAIMGATE_SUITE"],
              "evidence_bundler": os.environ["EB_SUITE"],
              "cal": os.environ["CAL_SUITE"],
              "contract_c2": os.environ["C2_SUITE"],
              "decision": os.environ["DECISION_SUITE"],
              "contract_e": os.environ["CONTRACT_E_SUITE"],
              "cross_chain": os.environ["CROSS_CHAIN"],
          }
          Path("build/cal_pipeline_prelocal_rc0/COMPONENT_STATUS.json").write_text(
              json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(value, sort_keys=True))
          PY

      - name: Upload complete pressure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-pipeline-prelocal-pressure-rc0
          path: build/cal_pipeline_prelocal_rc0
          if-no-files-found: warn

      - name: Scientific readiness gate
        if: always()
        env:
          CLAIMGATE_SUITE: ${{ steps.claimgate_suite.outcome }}
          EB_SUITE: ${{ steps.eb_suite.outcome }}
          CAL_SUITE: ${{ steps.cal_suite.outcome }}
          C2_SUITE: ${{ steps.c2_suite.outcome }}
          DECISION_SUITE: ${{ steps.decision_suite.outcome }}
          CONTRACT_E_SUITE: ${{ steps.contract_e_suite.outcome }}
          CROSS_CHAIN: ${{ steps.cross_chain.outcome }}
        run: |
          set -euo pipefail
          .venv-cal/bin/python - <<'PY'
          import json, os, sys
          from pathlib import Path
          statuses = [
              os.environ["CLAIMGATE_SUITE"],
              os.environ["EB_SUITE"],
              os.environ["CAL_SUITE"],
              os.environ["C2_SUITE"],
              os.environ["DECISION_SUITE"],
              os.environ["CONTRACT_E_SUITE"],
              os.environ["CROSS_CHAIN"],
          ]
          if any(status != "success" for status in statuses):
              print("PRELOCAL_PRESSURE_COMPONENT_OR_APPARATUS_NONPASS", statuses)
              raise SystemExit(1)
          path = Path("build/cal_pipeline_prelocal_rc0/RESULT.json")
          if not path.exists():
              print("PRELOCAL_PRESSURE_RESULT_MISSING")
              raise SystemExit(1)
          result = json.loads(path.read_text())
          classification = result.get("classification")
          print("SCIENTIFIC_CLASSIFICATION=" + str(classification))
          if classification != "SUPPORTED_FOR_LOCAL_PIPELINE_SMOKE_WITH_BOUNDS":
              raise SystemExit(1)
          PY
