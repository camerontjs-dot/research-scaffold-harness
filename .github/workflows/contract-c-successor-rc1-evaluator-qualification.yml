name: Contract C Successor RC1 Evaluator Qualification

on:
  push:
    branches:
      - sealed/contract-c-successor-rc1-fresh-eval-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-sealed-evaluator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sealed evaluator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen aperture ancestry and sealed-only mutation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 04560a7311a510c8ee4c82ad401b35bd7ca7590c HEAD
          test "$(git hash-object research/contract_c_successor_rc1_fresh_aperture/SPEC.md)" = "04d07b92f48a1dcb67cf5ebe58d74e985cdad150"
          test "$(git hash-object research/contract_c_successor_rc1_fresh_aperture/PRE_FREEZE_TASK.md)" = "663b27cfc1df2c1ede1fb76fadf2a901808d2b3d"
          test "$(git hash-object research/contract_c_successor_rc1_fresh_aperture/schema.json)" = "290259d60722553698e5cdddb8a02fa50ec2f3d0"
          test "$(git hash-object sealed/contract_c_successor_rc1_fresh_eval/evaluator.py)" = "8a15f745d10994235f908a7c2c5828354edfec57"
          test "$(git hash-object sealed/contract_c_successor_rc1_fresh_eval/reference_adapter.py)" = "c98f7ef2edb2998782259083d8da9e480e1bf411"
          test "$(git hash-object sealed/contract_c_successor_rc1_fresh_eval/mutant_candidate.py)" = "bfad010e25c780846a7b418895a1e3c058c88c66"
          git diff --quiet 04560a7311a510c8ee4c82ad401b35bd7ca7590c -- research/contract_c_successor_rc1_fresh_aperture
          changed="$(git diff --name-only 04560a7311a510c8ee4c82ad401b35bd7ca7590c...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(sealed/contract_c_successor_rc1_fresh_eval/|\.github/workflows/contract-c-successor-rc1-evaluator-qualification\.yml$)' | grep -q .; then
            echo 'sealed evaluator mutation escaped allowed surface' >&2
            exit 1
          fi

      - name: Checkout exact qualified Apparatus oracle
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ad1ffbd7906a7cf34cce5afa906a5797cd4a14ff
          path: _oracle
          fetch-depth: 1

      - name: Verify oracle identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _oracle rev-parse HEAD)" = "ad1ffbd7906a7cf34cce5afa906a5797cd4a14ff"
          test "$(git -C _oracle hash-object validators/contract_c.py)" = "9c75ccfbf2223578a8d1a7bf0c39673b394fbea4"
          test "$(git -C _oracle hash-object research/contract_c_non_deciding_shadow_rc0/shadow.py)" = "76df0c956a80ee5160c1da9bb27c5d0ffafeda40"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install oracle runtime dependency
        run: python -m pip install 'pydantic>=2,<3'

      - name: Compile sealed qualification apparatus
        run: |
          python -m py_compile sealed/contract_c_successor_rc1_fresh_eval/evaluator.py
          python -m py_compile sealed/contract_c_successor_rc1_fresh_eval/reference_adapter.py
          python -m py_compile sealed/contract_c_successor_rc1_fresh_eval/mutant_candidate.py

      - name: Known-good oracle must pass every evaluator check
        env:
          ORACLE_ROOT: ${{ github.workspace }}/_oracle
        run: |
          mkdir -p build/contract-c-successor-rc1-evaluator
          python sealed/contract_c_successor_rc1_fresh_eval/evaluator.py \
            sealed/contract_c_successor_rc1_fresh_eval/reference_adapter.py \
            --out build/contract-c-successor-rc1-evaluator/reference.json

      - name: Targeted mutants must be killed
        env:
          ORACLE_ROOT: ${{ github.workspace }}/_oracle
        shell: bash
        run: |
          set -euo pipefail
          for mode in accept_all reject_all reject_neutral ignore_contract_b ignore_whole_hash canonicalize_before_validate repair_unclassified; do
            out="build/contract-c-successor-rc1-evaluator/mutant-${mode}.json"
            if MUTANT_MODE="$mode" python sealed/contract_c_successor_rc1_fresh_eval/evaluator.py \
              sealed/contract_c_successor_rc1_fresh_eval/mutant_candidate.py --out "$out"; then
              echo "evaluator failed to kill mutant: $mode" >&2
              exit 1
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/contract-c-successor-rc1-evaluator')
          expected={
            'accept_all': ['reject_wrong_version'],
            'reject_all': ['valid_support_single'],
            'reject_neutral': ['valid_neutral_independent'],
            'ignore_contract_b': ['reject_b_bundle'],
            'ignore_whole_hash': ['whole_hash_stale_rejected'],
            'canonicalize_before_validate': ['reject_noncanonical_bytes'],
            'repair_unclassified': ['reject_unclassified_retained_contribution'],
          }
          receipt={}
          for mode, markers in expected.items():
            data=json.loads((root/f'mutant-{mode}.json').read_text())
            assert data['passed'] is False, mode
            failed=set(data['failed_checks'])
            assert any(marker in failed for marker in markers), (mode, failed)
            receipt[mode]=sorted(failed)
          (root/'MUTATION_QUALIFICATION.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print(json.dumps({k: len(v) for k,v in receipt.items()}, sort_keys=True))
          PY

      - name: Freeze evaluator qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('build/contract-c-successor-rc1-evaluator')
          ref=json.loads((root/'reference.json').read_text())
          muts=json.loads((root/'MUTATION_QUALIFICATION.json').read_text())
          receipt={
            'qualification':'SUPPORTED_EVALUATOR_QUALIFIED',
            'aperture_head':'04560a7311a510c8ee4c82ad401b35bd7ca7590c',
            'evaluator_blob':'8a15f745d10994235f908a7c2c5828354edfec57',
            'reference_adapter_blob':'c98f7ef2edb2998782259083d8da9e480e1bf411',
            'mutant_candidate_blob':'bfad010e25c780846a7b418895a1e3c058c88c66',
            'oracle_head':'ad1ffbd7906a7cf34cce5afa906a5797cd4a14ff',
            'reference_check_count':ref['check_count'],
            'reference_passed':ref['passed'],
            'mutants_killed':sorted(muts),
            'mutant_count':len(muts),
          }
          assert receipt['reference_passed'] is True
          assert receipt['mutant_count']==7
          (root/'QUALIFICATION.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
          tar -czf contract-c-successor-rc1-evaluator-${GITHUB_RUN_ID}.tar.gz -C build contract-c-successor-rc1-evaluator

      - name: Upload evaluator qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-successor-rc1-evaluator-${{ github.run_id }}
          path: contract-c-successor-rc1-evaluator-${{ github.run_id }}.tar.gz
          if-no-files-found: error
