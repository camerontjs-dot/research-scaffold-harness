name: Research - CAL Fresh Full Chain RC0 Preflight

on:
  push:
    branches:
      - research/cal-pipeline-fresh-full-chain-rc0-20260917
    paths:
      - "research/cal_pipeline_fresh_full_chain_rc0/**"
      - ".github/workflows/research-cal-fresh-full-chain-rc0-preflight.yml"
  workflow_dispatch:

jobs:
  front-half-preflight:
    runs-on: ubuntu-latest
    env:
      GATE_SHA: c0da10e2e3b9aada5f66af9859cf27964fd3c5fc
      CONTRACT_A_SHA: 529c92b49a34d5c610618551a8737f019f9fa332
      EB_SHA: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
      CAL_SHA: 8204417f478cfbd891499145a7edec5ee33405ad
      C2_SHA: b42c827acb0a9fe65353354d709add0e27bab307
      RESOLVER_SHA: 1d33e0612befcf8016816197c90c062373796df9
      DECISION_SHA: b1bcc33e2b5ef0707b8cbf7dd8e821b2d34d1b55
      CONTRACT_D_SHA: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
    steps:
      - name: Checkout series package
        uses: actions/checkout@v4

      - name: Checkout exact Gate V1.0.0
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/proposition-authoring
          ref: ${{ env.GATE_SHA }}
          path: gate
          fetch-depth: 1

      - name: Checkout released Contract A validator
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_A_SHA }}
          path: contracts
          fetch-depth: 1

      - name: Checkout exact Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: ${{ env.EB_SHA }}
          path: eb
          fetch-depth: 1

      - name: Checkout exact CAL consumer
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: ${{ env.CAL_SHA }}
          path: cal
          fetch-depth: 1

      - name: Checkout exact Contract C2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.C2_SHA }}
          path: c2
          fetch-depth: 1

      - name: Checkout exact resolver authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.RESOLVER_SHA }}
          path: resolver
          fetch-depth: 1

      - name: Checkout exact Decision Engine
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: ${{ env.DECISION_SHA }}
          path: decision
          fetch-depth: 1

      - name: Checkout exact Contract D authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: ${{ env.CONTRACT_D_SHA }}
          path: contract-d
          fetch-depth: 0
          fetch-tags: true

      - name: Verify exact authorities
        run: |
          test "$(git -C gate rev-parse HEAD)" = "$GATE_SHA"
          test "$(git -C contracts rev-parse HEAD)" = "$CONTRACT_A_SHA"
          test "$(git -C eb rev-parse HEAD)" = "$EB_SHA"
          test "$(git -C cal rev-parse HEAD)" = "$CAL_SHA"
          test "$(git -C c2 rev-parse HEAD)" = "$C2_SHA"
          test "$(git -C resolver rev-parse HEAD)" = "$RESOLVER_SHA"
          test "$(git -C decision rev-parse HEAD)" = "$DECISION_SHA"
          test "$(git -C contract-d rev-parse HEAD)" = "$CONTRACT_D_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen subjects
        run: |
          ok=0
          for attempt in 1 2 3; do
            if python gate/scripts/fetch_frozen_predecessors.py; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          python -m pip install -e 'gate[dev]'
          python -m pip install -e 'eb[dev]'
          python -m pip install -e 'cal[dev]'
          python -m pip install 'rfc8785==0.1.4'

      - name: Run Gate + released Contract A + EB preflight
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          cases = [
              ("not-needed-single", "research/cal_pipeline_fresh_full_chain_rc0/cases/not-needed.json", "NOT_NEEDED", "not_decomposed"),
              ("declared-all-of", "research/cal_pipeline_fresh_full_chain_rc0/cases/declared.json", "DECLARED", "declared"),
              ("health-canada-text-representation", "research/cal_pipeline_fresh_full_chain_rc0/cases/health-canada-text.json", "NOT_NEEDED", "not_decomposed"),
              ("valve-temporal-status", "research/cal_pipeline_fresh_full_chain_rc0/cases/valve-temporal-status.json", "NOT_NEEDED", "not_decomposed"),
          ]
          summaries = []

          for case_id, packet_rel, expected_state, expected_decomp in cases:
              case_root = Path("/tmp/full-chain-preflight") / case_id
              gate_out = case_root / "gate"
              eb_out = case_root / "eb"
              case_root.mkdir(parents=True, exist_ok=True)

              subprocess.run(
                  [
                      "python",
                      str(root / "gate/scripts/run_gate_v1_rc3.py"),
                      str(root / packet_rel),
                      "--out-dir",
                      str(gate_out),
                      "--implementation-identity",
                      os.environ["GATE_SHA"],
                  ],
                  check=True,
                  cwd=root / "gate",
              )

              claim = json.loads((gate_out / "CLAIM-GATE.json").read_text())
              contract_a = json.loads((gate_out / "CONTRACT-A.json").read_text())
              assert claim["authoring"]["state"] == expected_state, (case_id, claim["authoring"])
              assert claim["contract_a_binding"]["state"] == "present", case_id
              assert contract_a["decomposition"]["state"] == expected_decomp, (case_id, contract_a["decomposition"])

              validator = "import json,sys; from validators.contract_a import validate_candidate; obj=json.loads(open(sys.argv[1], encoding='utf-8').read()); validate_candidate(obj); print('CONTRACT_A_OK')"
              env = dict(os.environ)
              env["PYTHONPATH"] = str(root / "contracts")
              subprocess.run(
                  ["python", "-c", validator, str(gate_out / "CONTRACT-A.json")],
                  check=True,
                  env=env,
                  cwd=root,
              )

              subprocess.run(
                  [
                      "python",
                      str(root / "eb/scripts/run_v1_integration_candidate.py"),
                      str(gate_out / "CONTRACT-A.json"),
                      "--compatibility-carrier",
                      str(root / "eb/research/eb_v1_integration_candidate/contract_b_compatibility_carrier.json"),
                      "--out-dir",
                      str(eb_out),
                  ],
                  check=True,
                  cwd=root / "eb",
              )

              native = json.loads((eb_out / "native_eb_v1_package.json").read_text())
              projection = json.loads((eb_out / "projection_receipt.json").read_text())
              contract_b_dir = eb_out / "contract_b"
              assert contract_b_dir.is_dir() and any(contract_b_dir.iterdir()), case_id

              target_rel = {
                  "not-needed-single": "research/cal_pipeline_fresh_full_chain_rc0/targets/not-needed-single.json",
                  "health-canada-text-representation": "research/cal_pipeline_fresh_full_chain_rc0/targets/health-canada-text-representation.json",
                  "valve-temporal-status": "research/cal_pipeline_fresh_full_chain_rc0/targets/valve-temporal-status.json",
              }.get(case_id)
              target_validation = "not_applicable_decomposition_probe"
              if target_rel is not None:
                  subprocess.run(
                      [
                          "claim-audit-v1",
                          "validate-bundle",
                          str(contract_b_dir),
                          str(root / target_rel),
                      ],
                      check=True,
                      cwd=root / "cal",
                  )
                  target_validation = "PASS"

              summaries.append(
                  {
                      "case_id": case_id,
                      "gate_state": claim["authoring"]["state"],
                      "contract_a_handoff_sha256": contract_a["handoff_sha256"],
                      "contract_a_external_validation": "PASS",
                      "eb_package_sha256": native["package_sha256"],
                      "contract_b_bundle_hash": projection["bundle_hash"],
                      "projection_receipt_sha256": projection["receipt_sha256"],
                      "cal_target_validation": target_validation,
                  }
              )

          out = Path("/tmp/full-chain-preflight/PREFLIGHT-SUMMARY.json")
          out.write_text(json.dumps({"cases": summaries}, indent=2, sort_keys=True) + "\n")
          print(out.read_text())
          PY

      - name: Run CAL to C2 to Decision preflight for single-proposition cases
        run: |
          set -euo pipefail
          for case_id in not-needed-single health-canada-text-representation valve-temporal-status; do
            case_root="/tmp/full-chain-preflight/$case_id"
            target="$GITHUB_WORKSPACE/research/cal_pipeline_fresh_full_chain_rc0/targets/$case_id.json"
            python "$GITHUB_WORKSPACE/cal/scripts/run_cal_v1_bundle.py" \
              "$case_root/eb/contract_b" \
              "$target" \
              --out-dir "$case_root/cal"

            python "$GITHUB_WORKSPACE/research/cal_pipeline_fresh_full_chain_rc0/materialize_c2_from_cal.py" \
              --bundle-dir "$case_root/eb/contract_b" \
              --target "$target" \
              --cal-result "$case_root/cal/result.json" \
              --cal-root "$GITHUB_WORKSPACE/cal" \
              --c2-root "$GITHUB_WORKSPACE/c2" \
              --resolver-root "$GITHUB_WORKSPACE/resolver" \
              --out "$case_root/contract-c2.json" \
              --receipt "$case_root/c2-materialization-receipt.json"

            python "$GITHUB_WORKSPACE/research/cal_pipeline_fresh_full_chain_rc0/prepare_decision_c2_inputs.py" \
              "$case_root/contract-c2.json" \
              --out-dir "$case_root/decision-input"

            c2_sha="$(tr -d '\n' < "$case_root/decision-input/contract-c2-sha256.txt")"
            node "$GITHUB_WORKSPACE/decision/scripts/decision-engine-evaluate-c2.mjs" \
              --contract-c2 "$case_root/contract-c2.json" \
              --contract-c2-sha256 "$c2_sha" \
              --contract-c2-authority "$GITHUB_WORKSPACE/c2" \
              --contract-d-authority "$GITHUB_WORKSPACE/contract-d" \
              --expected-contract-b "$case_root/decision-input/expected-contract-b.json" \
              --policy decision-engine.contract-c.supported-claim-verification@1.0.0 \
              --context "$case_root/decision-input/decision-context.json" \
              > "$case_root/contract-d.json"
          done

      - name: Snapshot preflight outputs
        run: |
          python research/cal_pipeline_provenance_run_series_rc1/pack_tree.py \
            /tmp/full-chain-preflight \
            /tmp/cal-fresh-full-chain-rc0-preflight.zip

      - name: Freeze preflight outputs
        uses: actions/upload-artifact@v4
        with:
          name: cal-fresh-full-chain-rc0-preflight
          path: |
            /tmp/cal-fresh-full-chain-rc0-preflight.zip
            /tmp/full-chain-preflight/PREFLIGHT-SUMMARY.json
          if-no-files-found: error
