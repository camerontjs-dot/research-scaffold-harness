name: Contract C CAL V1 parent consumer post-freeze comparison

on:
  push:
    branches:
      - research/contract-c-cal-v1-parent-consumer-postfreeze-20260919
  pull_request:
    paths:
      - "research/contract_c_cal_v1_parent_consumer_postfreeze_20260919/**"
      - ".github/workflows/contract-c-cal-v1-parent-consumer-postfreeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen-consumer descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen consumer ancestry and blobs
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c91b9bb9a0b03522f1cd94da82544fa02e72f862 HEAD
          test "$(git rev-parse c91b9bb9a0b03522f1cd94da82544fa02e72f862:candidate/consumer.py)" = "3d36881673575adafc42e9a0f9b2b7fae2d5bf9d"
          test "$(git rev-parse c91b9bb9a0b03522f1cd94da82544fa02e72f862:candidate/test_consumer.py)" = "1b89b9536106fa66568953d3ff5f8e3e850027b2"
          test "$(git rev-parse c91b9bb9a0b03522f1cd94da82544fa02e72f862:candidate/FREEZE_RECEIPT.json)" = "c381f36f9d438468e2f8ec956f77317c3486f623"
          test "$(git rev-parse HEAD:candidate/consumer.py)" = "3d36881673575adafc42e9a0f9b2b7fae2d5bf9d"
          test "$(git rev-parse HEAD:candidate/test_consumer.py)" = "1b89b9536106fa66568953d3ff5f8e3e850027b2"
          test "$(git rev-parse HEAD:candidate/FREEZE_RECEIPT.json)" = "c381f36f9d438468e2f8ec956f77317c3486f623"
          if git diff --name-only c91b9bb9a0b03522f1cd94da82544fa02e72f862..HEAD -- candidate | grep -q .; then
            echo "frozen candidate subtree changed post-freeze" >&2
            exit 1
          fi

      - name: Checkout exact producer subject
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 7138f6c1599b9b8f8c655f85c9eba0c264fb3b26
          path: _apparatus
          fetch-depth: 1

      - name: Checkout exact Candidate A RC2 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: _c2
          fetch-depth: 1

      - name: Checkout exact current-CAL resolver
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: _resolver_repo
          fetch-depth: 1

      - name: Checkout exact frozen CAL V1
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e24e405f5336ee024674f39dba97255bb58a2dd9
          path: _cal
          fetch-depth: 1

      - name: Checkout exact frozen Evidence Bundler
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: _eb
          fetch-depth: 1

      - name: Verify exact external identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _apparatus rev-parse HEAD)" = "7138f6c1599b9b8f8c655f85c9eba0c264fb3b26"
          test "$(git -C _c2 rev-parse HEAD)" = "b42c827acb0a9fe65353354d709add0e27bab307"
          test "$(git -C _resolver_repo rev-parse HEAD)" = "1d33e0612befcf8016816197c90c062373796df9"
          test "$(git -C _cal rev-parse HEAD)" = "e24e405f5336ee024674f39dba97255bb58a2dd9"
          test "$(git -C _eb rev-parse HEAD)" = "4e1f6fe00e7c350b28f52bfea14f1f8988847884"
          test "$(git -C _apparatus rev-parse HEAD:research/contract_c_cal_v1_parent_recomposition_rc0_20260919/candidate_rc0.py)" = "df6b6ed410f52cafaeadfe1578d770f480a34b09"
          grep -q 'SEMANTIC_IMPLEMENTATION_SHA = "847cc970642bb648dc994b929c2053b5c9d4648c"' _cal/src/claim_audit_lab/production_v1/__init__.py
          grep -q '"cal_semantic_code_head": "7cf0d2e50562ec4ce4082d1e1c058a11025b1a48"' _cal/research/cal_v1_prototype_freeze_20260918/FREEZE.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pydantic PyYAML click pypdf pdfminer.six rank-bm25

      - name: Re-run frozen prereveal consumer suite
        env:
          PYTHONHASHSEED: "0"
        run: python -B -m unittest discover -s candidate -p 'test_consumer.py' -v

      - name: Frozen CAL decomposition controls
        env:
          PYTHONPATH: ${{ github.workspace }}/_cal/src
        run: python -m pytest -q _cal/tests/production/test_decomposition_composer_rc0.py

      - name: Execute post-freeze real-handoff comparison
        id: comparison
        continue-on-error: true
        env:
          APPARATUS_ROOT: ${{ github.workspace }}/_apparatus
          CAL_ROOT: ${{ github.workspace }}/_cal
          EB_ROOT: ${{ github.workspace }}/_eb
          CAL_EB_INTEGRATION_REPO: ${{ github.workspace }}/_eb
          C2_ROOT: ${{ github.workspace }}/_c2
          RESOLVER_JSON: ${{ github.workspace }}/_resolver_repo/research/contract_c2_current_cal_resolver_successor_rc0/RESOLVER.json
        run: |
          python research/contract_c_cal_v1_parent_consumer_postfreeze_20260919/compare_post_freeze.py             research/contract_c_cal_v1_parent_consumer_postfreeze_20260919/COMPARISON_RESULTS.json

      - name: Record comparison receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("research/contract_c_cal_v1_parent_consumer_postfreeze_20260919")
          result = root / "COMPARISON_RESULTS.json"
          receipt = {
              "schema": "contract-c-cal-v1-parent-consumer-postfreeze-receipt-v1",
              "github_sha": os.environ["GITHUB_SHA"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "frozen_consumer_commit": "c91b9bb9a0b03522f1cd94da82544fa02e72f862",
              "consumer_blob": "3d36881673575adafc42e9a0f9b2b7fae2d5bf9d",
              "test_blob": "1b89b9536106fa66568953d3ff5f8e3e850027b2",
              "freeze_receipt_blob": "c381f36f9d438468e2f8ec956f77317c3486f623",
              "result_present": result.exists(),
              "result_sha256": (
                  "sha256:" + hashlib.sha256(result.read_bytes()).hexdigest()
                  if result.exists() else None
              ),
          }
          (root / "COMPARISON_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload preserved comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-c-cal-v1-parent-consumer-postfreeze
          path: |
            research/contract_c_cal_v1_parent_consumer_postfreeze_20260919/COMPARISON_RESULTS.json
            research/contract_c_cal_v1_parent_consumer_postfreeze_20260919/COMPARISON_RECEIPT.json
          if-no-files-found: warn

      - name: Enforce comparison result
        if: steps.comparison.outcome != 'success'
        run: exit 1
