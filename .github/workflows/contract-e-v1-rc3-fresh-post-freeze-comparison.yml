name: Contract E RC3 fresh post-freeze comparison

on:
  push:
    branches:
      - research/contract-e-v1-rc3-fresh-independent-execution-20260904
    paths:
      - .github/workflows/contract-e-v1-rc3-fresh-post-freeze-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen reproduction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen reproduction identities
        shell: bash
        run: |
          set -euo pipefail
          IMPL='research/contract_e_v1_fresh_rc3/authority_e.py'
          TEST='research/contract_e_v1_fresh_rc3/test_authority_e.py'
          RECEIPT='ed18b8898c73c2721e894ccffbdd40b67df60714'
          git merge-base --is-ancestor "$RECEIPT" HEAD
          test "$(git rev-parse "HEAD:$IMPL")" = '9019abd8ade820988de1f899b2ccef9e57e9a908'
          test "$(git rev-parse "HEAD:$TEST")" = '818c44ad377d95344d158a7698d625548c0f5397'
          test "$(git rev-parse "$RECEIPT:$IMPL")" = '9019abd8ade820988de1f899b2ccef9e57e9a908'
          test "$(git rev-parse "$RECEIPT:$TEST")" = '818c44ad377d95344d158a7698d625548c0f5397'
          echo '0246dd6e43b780f8b37b0ea486ed9c376f6579c7a05161318f928e8d00dc1b6c  research/contract_e_v1_fresh_rc3/authority_e.py' | sha256sum -c -
          echo '7718074871cf77a1b7f0ad2a5f813e47cfb1d1dc5099330b0e9a4f0f9392d569  research/contract_e_v1_fresh_rc3/test_authority_e.py' | sha256sum -c -

      - name: Re-run frozen prereveal tests after reveal
        id: prereveal
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p post_freeze_results
          (
            cd research/contract_e_v1_fresh_rc3
            python -m unittest -v test_authority_e.py
          ) 2>&1 | tee post_freeze_results/prereveal-rerun.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > post_freeze_results/prereveal-rerun-exit-status.txt
          exit "$status"

      - name: Check out exact sealed Apparatus evaluator
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: a678c73a661853a3a704666fc6bbf29fa378948f
          path: apparatus-contracts
          fetch-depth: 1

      - name: Verify sealed evaluator identities
        shell: bash
        run: |
          set -euo pipefail
          A='apparatus-contracts'
          test "$(git -C "$A" rev-parse HEAD)" = 'a678c73a661853a3a704666fc6bbf29fa378948f'
          test "$(git -C "$A" rev-parse 'HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/FINAL_SEAL_RECEIPT.json')" = 'b819b4beb44a02d8f2adf823ea2538621b43495e'
          test "$(git -C "$A" rev-parse 'HEAD:docs/research/contract-e/v1-rc3-target-reference-cardinality-successor-20260903/candidate/reference.py')" = '00d4d8f078073388d751546c24678825b89a6402'
          test "$(git -C "$A" rev-parse 'HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/evaluate_fresh.py')" = '5bba49c6a412c689232ea1315df0153455dd316f'
          test "$(git -C "$A" rev-parse 'HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/target_cardinality_cases.py')" = '94b6d2c91b0124e7d9469ae24731945a60721ac8'
          test "$(git -C "$A" rev-parse 'HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/QUALIFICATION-CONTRACT.md')" = '21f5f5e78e82222e8d2d8dba0e645bf7f01c7a14'
          test "$(git -C "$A" rev-parse 'HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/qualify.py')" = 'b23103db7a4f34144ef0103668ebadd932156c0d'
          {
            echo "reproduction_head=$(git rev-parse HEAD)"
            echo "implementation_blob=$(git rev-parse HEAD:research/contract_e_v1_fresh_rc3/authority_e.py)"
            echo "test_blob=$(git rev-parse HEAD:research/contract_e_v1_fresh_rc3/test_authority_e.py)"
            echo "implementation_sha256=$(sha256sum research/contract_e_v1_fresh_rc3/authority_e.py | awk '{print $1}')"
            echo "test_sha256=$(sha256sum research/contract_e_v1_fresh_rc3/test_authority_e.py | awk '{print $1}')"
            echo "apparatus_head=$(git -C "$A" rev-parse HEAD)"
            echo "evaluator_blob=$(git -C "$A" rev-parse HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/evaluate_fresh.py)"
            echo "target_cases_blob=$(git -C "$A" rev-parse HEAD:sealed/contract-e-v1-rc3-target-cardinality-successor/target_cardinality_cases.py)"
            echo "successor_reference_blob=$(git -C "$A" rev-parse HEAD:docs/research/contract-e/v1-rc3-target-reference-cardinality-successor-20260903/candidate/reference.py)"
          } > post_freeze_results/IDENTITIES.txt

      - name: Run sealed 62-case comparison against frozen implementation
        id: comparison
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p post_freeze_results
          python apparatus-contracts/sealed/contract-e-v1-rc3-target-cardinality-successor/evaluate_fresh.py \
            --implementation "$GITHUB_WORKSPACE/research/contract_e_v1_fresh_rc3/authority_e.py" \
            --output-dir "$GITHUB_WORKSPACE/post_freeze_results" \
            2>&1 | tee post_freeze_results/comparison.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > post_freeze_results/comparison-exit-status.txt
          exit "$status"

      - name: Upload immutable comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-v1-rc3-fresh-post-freeze-comparison
          path: post_freeze_results/
          if-no-files-found: error

      - name: Enforce scientific comparison result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('post_freeze_results/RESULTS.json')
          if not path.exists():
              raise SystemExit('sealed comparison did not produce RESULTS.json')
          payload = json.loads(path.read_text())
          comparison = payload['comparison']
          regression = payload['predecessor_reference_regression']
          print(json.dumps({
              'scientific_state': comparison['scientific_state'],
              'case_count': comparison['case_count'],
              'normative_exact_matches': comparison['normative_exact_matches'],
              'normative_mismatch_ids': comparison['normative_mismatch_ids'],
              'false_permit_ids': comparison['false_permit_ids'],
              'false_reject_ids': comparison['false_reject_ids'],
              'exception_ids': comparison['exception_ids'],
              'preservation_failure_ids': comparison['preservation_failure_ids'],
              'diagnostic_shape_failure_ids': comparison['diagnostic_shape_failure_ids'],
              'target_cardinality_failure_ids': comparison['target_cardinality_failure_ids'],
              'predecessor_reference_regression': regression,
          }, indent=2, sort_keys=True))
          if comparison['scientific_state'] != 'SUPPORTED' or regression['state'] != 'PASS':
              raise SystemExit(1)
          PY
