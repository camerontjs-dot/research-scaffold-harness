name: CAL Pipeline V1 prototype freeze RC0

on:
  pull_request:
    paths:
      - ".github/workflows/cal-pipeline-v1-prototype-freeze-rc0.yml"
      - "qualification/cal_pipeline_v1_prototype_freeze_rc0/**"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/proposition-authoring
          ref: b3278e960707720f5add10935027a7187725d446
          path: deps/claimgate
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: deps/eb
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 8204417f478cfbd891499145a7edec5ee33405ad
          path: deps/cal
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: deps/apparatus-c2
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: deps/apparatus-resolver
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 43b571464734325277374ee81098553fb7c1b944
          path: deps/apparatus-resolver-old
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          path: deps/apparatus-c1
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: deps/apparatus-d
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: a678c73a661853a3a704666fc6bbf29fa378948f
          path: deps/apparatus-e
      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: b1bcc33e2b5ef0707b8cbf7dd8e821b2d34d1b55
          path: deps/decision

      - name: Install bounded environments
        run: |
          set -euo pipefail
          python -m venv .venv-cg
          .venv-cg/bin/python -m pip install --upgrade pip
          .venv-cg/bin/python -m pip install -e 'deps/claimgate[dev]'
          (cd deps/claimgate && ../../.venv-cg/bin/python scripts/fetch_frozen_predecessors.py)

          python -m venv .venv-eb
          .venv-eb/bin/python -m pip install --upgrade pip
          .venv-eb/bin/python -m pip install 'click>=8.1,<9' 'pdfminer.six>=20231228,<20270000' 'pydantic>=2.6,<3' 'pypdf>=4,<7' 'PyYAML>=6,<7' 'rank-bm25>=0.2.2,<0.3' 'pytest>=8,<10'
          .venv-eb/bin/python -m pip install -e deps/eb --no-deps

          python -m venv .venv-cal
          .venv-cal/bin/python -m pip install --upgrade pip
          .venv-cal/bin/python -m pip install -e 'deps/cal[dev]'
          .venv-cal/bin/python -m pip install rfc8785
          mkdir -p build/_prototype-freeze-component-logs

      - name: Static qualification apparatus check
        id: static
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-cal/bin/python -m compileall -q qualification/cal_pipeline_v1_prototype_freeze_rc0
          .venv-cal/bin/python - <<'PY'
          import json
          from pathlib import Path
          q = Path('qualification/cal_pipeline_v1_prototype_freeze_rc0')
          manifest = json.loads((q / 'MANIFEST.json').read_text())
          cohort = json.loads((q / 'COHORT.json').read_text())
          assert manifest['campaign'] == 'cal-pipeline-v1-prototype-freeze-rc0'
          assert cohort['campaign'] == 'cal-pipeline-v1-prototype-freeze-rc0'
          assert len(cohort['cases']) == 10
          assert cohort['frozen_before_runner'] is True
          print('STATIC_APPARATUS_PASS')
          PY

      - name: ClaimGate qualification suites
        id: claimgate
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/claimgate
          {
            ../../.venv-cg/bin/python -m pytest -q tests/test_contract_a.py tests/test_convergence_choices.py tests/test_scope_ambiguity.py tests/test_rc1_development_cases.py tests/test_weak_controls.py tests/test_rc2_semantic_instruments.py
            ../../.venv-cg/bin/python -m pytest -q tests/test_rc3_coverage.py tests/test_rc4a_profile_alignment.py
            ../../.venv-cg/bin/ruff check src tests scripts integration/claimgate_v1_candidate
          } 2>&1 | tee "$GITHUB_WORKSPACE/build/_prototype-freeze-component-logs/claimgate.log"

      - name: Evidence Bundler boundary suite
        id: eb
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-eb/bin/python -m pytest -q deps/eb/tests/test_v1_contract_b_projection.py 2>&1 | tee build/_prototype-freeze-component-logs/evidence-bundler.log

      - name: Current CAL focused suite
        id: cal
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/cal
          ../../.venv-cal/bin/python -m pytest -q tests/production/test_convergence_semantics.py tests/production/test_contract_b_integration_candidate.py tests/production/test_contract_b_run_surface.py tests/production/test_rc1_semantic_behavior.py tests/production/test_production_cli.py tests/production/test_semantic_blob_identity.py tests/production/test_rc1_authority_integrity.py tests/production/test_target_identity_binding.py 2>&1 | tee "$GITHUB_WORKSPACE/build/_prototype-freeze-component-logs/cal.log"

      - name: Contract C2 validator suite
        id: c2
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/apparatus-c2
          ../../.venv-cal/bin/python -m pytest -q tests/test_contract_c_v2.py 2>&1 | tee "$GITHUB_WORKSPACE/build/_prototype-freeze-component-logs/contract-c2.log"

      - name: Decision C2 ingress suite
        id: decision
        continue-on-error: true
        env:
          APPARATUS_CONTRACT_C2_DIR: ${{ github.workspace }}/deps/apparatus-c2
          APPARATUS_CONTRACT_C_DIR: ${{ github.workspace }}/deps/apparatus-c1
          APPARATUS_CONTRACT_D_DIR: ${{ github.workspace }}/deps/apparatus-d
          DECISION_C2_OUTPUT_DIR: ${{ github.workspace }}/build/decision-c2-prototype-freeze
          PYTHON: ${{ github.workspace }}/.venv-cal/bin/python
        run: |
          set -euo pipefail
          cd deps/decision
          node tests/contractC2Ingress.integration.mjs 2>&1 | tee "$GITHUB_WORKSPACE/build/_prototype-freeze-component-logs/decision.log"

      - name: Contract E RC3 control suite
        id: contract_e
        continue-on-error: true
        run: |
          set -euo pipefail
          cd deps/apparatus-e/docs/research/contract-e/v1-rc3-target-reference-cardinality-successor-20260903/candidate
          ${{ github.workspace }}/.venv-cal/bin/python test_successor.py 2>&1 | tee "$GITHUB_WORKSPACE/build/_prototype-freeze-component-logs/contract-e.log"

      - name: Execute frozen ten-case campaign twice
        id: campaign
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-cal/bin/python qualification/cal_pipeline_v1_prototype_freeze_rc0/run_qualification.py 2>&1 | tee build/_prototype-freeze-component-logs/campaign.log

      - name: Preserve component and workflow outcomes
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          CLAIMGATE: ${{ steps.claimgate.outcome }}
          EB: ${{ steps.eb.outcome }}
          CAL: ${{ steps.cal.outcome }}
          C2: ${{ steps.c2.outcome }}
          DECISION: ${{ steps.decision.outcome }}
          CONTRACT_E: ${{ steps.contract_e.outcome }}
          CAMPAIGN: ${{ steps.campaign.outcome }}
        run: |
          set -euo pipefail
          mkdir -p build/cal_pipeline_v1_prototype_freeze_rc0/component-logs
          cp -a build/_prototype-freeze-component-logs/. build/cal_pipeline_v1_prototype_freeze_rc0/component-logs/ || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = {
              'static': os.environ['STATIC'],
              'claimgate': os.environ['CLAIMGATE'],
              'evidence_bundler': os.environ['EB'],
              'cal': os.environ['CAL'],
              'contract_c2': os.environ['C2'],
              'decision': os.environ['DECISION'],
              'contract_e': os.environ['CONTRACT_E'],
              'campaign': os.environ['CAMPAIGN'],
          }
          path = Path('build/cal_pipeline_v1_prototype_freeze_rc0/COMPONENT_STATUS.json')
          path.write_text(json.dumps(value, sort_keys=True, indent=2) + '\n')
          print(json.dumps(value, sort_keys=True))
          PY

      - name: Build safe deterministic evidence package
        id: package
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          .venv-cal/bin/python qualification/cal_pipeline_v1_prototype_freeze_rc0/package_evidence.py --build-root build

      - name: Upload packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-pipeline-v1-prototype-freeze-rc0
          path: |
            build/cal_pipeline_v1_prototype_freeze_rc0.tar.gz
            build/cal_pipeline_v1_prototype_freeze_rc0-FILE_HASHES.json
            build/cal_pipeline_v1_prototype_freeze_rc0-ARCHIVE_SHA256.txt
            build/cal_pipeline_v1_prototype_freeze_rc0-PACKAGE.json
          if-no-files-found: warn

      - name: Prototype freeze gate
        if: always()
        env:
          STATIC: ${{ steps.static.outcome }}
          CLAIMGATE: ${{ steps.claimgate.outcome }}
          EB: ${{ steps.eb.outcome }}
          CAL: ${{ steps.cal.outcome }}
          C2: ${{ steps.c2.outcome }}
          DECISION: ${{ steps.decision.outcome }}
          CONTRACT_E: ${{ steps.contract_e.outcome }}
          CAMPAIGN: ${{ steps.campaign.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
        run: |
          set -euo pipefail
          .venv-cal/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          keys = ('STATIC','CLAIMGATE','EB','CAL','C2','DECISION','CONTRACT_E','CAMPAIGN','PACKAGE')
          states = {key: os.environ[key] for key in keys}
          print(json.dumps(states, sort_keys=True))
          if any(value != 'success' for value in states.values()):
              raise SystemExit('PROTOTYPE_FREEZE_PREREQUISITE_NONPASS')
          result = json.loads(Path('build/cal_pipeline_v1_prototype_freeze_rc0/RESULT.json').read_text())
          expected = 'CAL_PIPELINE_V1_PROTOTYPE_CANDIDATE_FROZEN_FOR_LOCAL_SMOKE'
          if result.get('classification') != expected:
              raise SystemExit('SCIENTIFIC_CLASSIFICATION=' + str(result.get('classification')))
          if result.get('case_count') != 10 or result.get('whole_campaign_replay_identical') is not True:
              raise SystemExit('INCOMPLETE_PROTOTYPE_FREEZE_RECEIPT')
          package = json.loads(Path('build/cal_pipeline_v1_prototype_freeze_rc0-PACKAGE.json').read_text())
          if package.get('self_referential_archive_identity') is not False:
              raise SystemExit('INVALID_EVIDENCE_PACKAGE_IDENTITY')
          print(expected)
          PY
