name: Contract E production-envelope shadow RC0

on:
  push:
    branches:
      - research/contract-e-production-envelope-shadow-rc0-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frozen RC0 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen RC0 candidate and evaluator identities
        shell: bash
        run: |
          set -euo pipefail
          ROOT='research/contract_e_production_envelope_shadow_rc0'
          RECEIPT='4480438a8069e5d040ad9221c05be52e63c94f04'
          git merge-base --is-ancestor "$RECEIPT" HEAD
          test "$(git rev-parse "HEAD:$ROOT/shadow_pep.py")" = 'bd60ba1da3e1098d4d1a82d6b99bae6255843529'
          test "$(git rev-parse "HEAD:$ROOT/evaluate_rc0.py")" = 'b274b963603612ed3ff2993f76c067fa7c09ec31'
          test "$(git rev-parse "b9d8e93ac414d37bb3288669526aab9bc28a9f5a:$ROOT/shadow_pep.py")" = 'bd60ba1da3e1098d4d1a82d6b99bae6255843529'
          test "$(git rev-parse "96a5ef58b199fad22bfe46875b6074f6aab36f71:$ROOT/evaluate_rc0.py")" = 'b274b963603612ed3ff2993f76c067fa7c09ec31'

      - name: Check out exact Contract D 1.0.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: apparatus-d
          fetch-depth: 1

      - name: Check out exact sealed Contract E successor
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: a678c73a661853a3a704666fc6bbf29fa378948f
          path: apparatus-e
          fetch-depth: 1

      - name: Check out exact frozen fresh-independent Contract E implementation
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/research-scaffold-harness
          ref: 9feb44d8c8ea96176f797fe0ef692cc8e4d13656
          path: rsh-e
          fetch-depth: 1

      - name: Verify all external frozen authority blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C apparatus-d rev-parse HEAD)" = '298a1a0f7b7b6d7712e11200d04faec3e1ca169b'
          test "$(git -C apparatus-d rev-parse HEAD:validators/contract_d_core.py)" = '564dcde5677df5ac8f86f21dc0ffd1692f44c9f0'
          test "$(git -C apparatus-d rev-parse HEAD:validators/contract_d_validate.py)" = 'c03ef6c6f059cd03addf5e69b01025bb9a6af8d2'
          test "$(git -C apparatus-d rev-parse HEAD:validators/contract_d_consume.py)" = '8b4ad5c9d6fc1145cf334d1416b5d52b9ed93c68'
          test "$(git -C apparatus-d rev-parse HEAD:schema/contract-d/1.0.0/effect-registry.json)" = 'a40f4f4447470654bdc16d852f5927189ae30cc5'

          test "$(git -C apparatus-e rev-parse HEAD)" = 'a678c73a661853a3a704666fc6bbf29fa378948f'
          test "$(git -C apparatus-e rev-parse HEAD:docs/research/contract-e/v1-rc3-exact-currentness-jcs-20260902/candidate/SPEC.md)" = '8c142c6b86dd2512f1df0c19aa36dbef759d6c18'
          test "$(git -C apparatus-e rev-parse HEAD:docs/research/contract-e/v1-rc3-target-reference-cardinality-successor-20260903/candidate/reference.py)" = '00d4d8f078073388d751546c24678825b89a6402'

          test "$(git -C rsh-e rev-parse HEAD)" = '9feb44d8c8ea96176f797fe0ef692cc8e4d13656'
          test "$(git -C rsh-e rev-parse HEAD:research/contract_e_v1_fresh_rc3/authority_e.py)" = '9019abd8ade820988de1f899b2ccef9e57e9a908'

      - name: Install exact canonicalization dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'rfc8785==0.1.4'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('rfc8785') == '0.1.4'
          print('rfc8785==0.1.4')
          PY

      - name: Run frozen RC0 matrix and weak controls
        id: science
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p rc0-results
          python research/contract_e_production_envelope_shadow_rc0/evaluate_rc0.py \
            --candidate research/contract_e_production_envelope_shadow_rc0/shadow_pep.py \
            --apparatus-d apparatus-d \
            --apparatus-e apparatus-e \
            --independent-e rsh-e/research/contract_e_v1_fresh_rc3/authority_e.py \
            --output-dir rc0-results \
            2>&1 | tee rc0-results/evaluation.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > rc0-results/evaluation-exit-status.txt
          exit "$status"

      - name: Capture exact run identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc0-results
          {
            echo "RC0_HEAD=$(git rev-parse HEAD)"
            echo "CANDIDATE_BLOB=$(git rev-parse HEAD:research/contract_e_production_envelope_shadow_rc0/shadow_pep.py)"
            echo "EVALUATOR_BLOB=$(git rev-parse HEAD:research/contract_e_production_envelope_shadow_rc0/evaluate_rc0.py)"
            echo "CONTRACT_D_HEAD=$(git -C apparatus-d rev-parse HEAD)"
            echo "CONTRACT_E_HEAD=$(git -C apparatus-e rev-parse HEAD)"
            echo "INDEPENDENT_E_HEAD=$(git -C rsh-e rev-parse HEAD)"
          } > rc0-results/RUN_IDENTITIES.txt
          sha256sum \
            research/contract_e_production_envelope_shadow_rc0/shadow_pep.py \
            research/contract_e_production_envelope_shadow_rc0/evaluate_rc0.py \
            > rc0-results/RC0_SHA256.txt

      - name: Upload immutable RC0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-e-production-envelope-shadow-rc0-${{ github.sha }}
          path: rc0-results/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce accepted scientific result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f rc0-results/evaluation-exit-status.txt
          test "$(cat rc0-results/evaluation-exit-status.txt)" = '0'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('rc0-results/RESULTS.json')
          if not p.exists():
              raise SystemExit('missing RESULTS.json')
          data = json.loads(p.read_text())
          assert data['scientific_state'] == 'SUPPORTED_FOR_BOUNDED_SHADOW_CLAIM', data
          assert data['case_count'] == 26, data
          assert data['case_pass_count'] == 26, data
          assert data['false_allow_ids'] == [], data
          assert data['positive_failure_ids'] == [], data
          assert data['target_integrity_failure_ids'] == [], data
          assert data['execution_flag_failure_ids'] == [], data
          assert data['weak_control_count'] == 6, data
          assert data['weak_controls_caught'] == 6, data
          assert data['missed_weak_controls'] == [], data
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
