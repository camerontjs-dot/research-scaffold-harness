[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-scaffold-harness"
version = "0.1.0"
description = "Run bounded research tasks under scaffold conditions and emit C-A scaffold-run artifacts for the research apparatus."
readme = "README.md"
requires-python = ">=3.11,<3.13"
keywords = ["research", "scaffold", "provenance", "audit", "cli"]
authors = [
    { name = "Cameron Sanderson" },
]
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing",
]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.15,<1",
    "types-PyYAML>=6.0,<7",
]
mlx = [
    "mlx-lm>=0.18,<1",
    "huggingface-hub>=0.24,<1",
]

[project.scripts]
scaffold-harness = "research_scaffold_harness.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research_scaffold_harness.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires loaded MLX model on Apple Silicon hardware",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Calibration and probe scripts build long human-readable report strings.
"scripts/**" = ["E501"]
